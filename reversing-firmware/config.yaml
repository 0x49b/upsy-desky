substitutions:
  name: "upsy-desky"

  # Adjust these if nothing (or only garbage) shows up in the logs.
  # Common baud rates: 9600, 19200, 38400, 57600, 115200
  # Available GPIOs on the RJ45 passthrough: 16, 17, 18, 19, 21, 22
  baud_rate: "9600"
  handset_tx_pin: "17"
  handset_rx_pin: "16"

esphome:
  name: "${name}"
  name_add_mac_suffix: true

esp32:
  board: esp32dev

logger:
  level: DEBUG

# UART logging is from the perspective of the handset, i.e.:
# - TX is the data sent from the handset to the control box
# - RX is the data sent from the control box to the handset
uart:
  - # Direction: Handset -> Control Box
    id: handset_tx
    baud_rate: ${baud_rate}
    rx_pin: ${handset_tx_pin}
    debug: &uart_debug
      direction: RX
      dummy_receiver: true
      after:
        timeout: 50ms
      sequence:
        - lambda: UARTDebug::log_hex(uart::UART_DIRECTION_TX, bytes, ':');
  - # Direction: Control Box -> Handset
    id: handset_rx
    baud_rate: ${baud_rate}
    rx_pin: ${handset_rx_pin}
    debug:
      <<: *uart_debug
      sequence:
        - lambda: UARTDebug::log_hex(uart::UART_DIRECTION_RX, bytes, ':');

wifi:
  ap:
    password: "hunter2hunter2"

captive_portal:

improv_serial:

web_server:
  port: 80

ota:
  - platform: esphome
    password: ""